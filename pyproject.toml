[tool.poetry]
name = "webhorus"
version = "0.2.16"
description = ""
authors = ["xssfox <xss@sprocketfox.io>"]
readme = "README.md"

packages = [
    { include = "pywenet", from="."},
    { include = "rx", from="wenet"},
   
]


[tool.poetry.build]
script = "build_lib.py"
generate-setup-file = true

[tool.poetry.dependencies]
python = "^3.13"

# Required for building pywenet
cffi = "^1.17.1"

# Work around for https://github.com/dateutil/dateutil/issues/1430
six = "1.5"

# Required for wenet
cbor2 = "5.9.0"


horusdemodlib = "^0.6.2"

[tool.poetry.group.dev.dependencies]
setuptools = "^75.8.2"
cffi = "1.17.1"


[build-system]
requires = ["poetry-core","setuptools","cffi"]
build-backend = "poetry.core.masonry.api"
